services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Host file-change events don't cross the Windows bind mount into the
      # Linux container, so Vite's watcher never fires without polling.
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/app
      # A bind mount ignores .dockerignore, so the host's Windows node_modules
      # (rolldown ships win32-x64-msvc native bindings) would otherwise shadow
      # the Linux packages installed at build time. Compose reuses this
      # anonymous volume across recreates, so after any package.json change
      # run `docker compose down -v` — a rebuild alone will not refresh it.
      - /app/node_modules
    depends_on:
      - web

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Live-mount the source so edits apply without rebuilding the image.
      # runserver's StatReloader polls file times, which works over bind
      # mounts, so the server restarts on save.
      - ./backend:/app
      # A bind mount ignores .dockerignore, so the host's Windows-compiled
      # venv/ would otherwise shadow the Linux packages installed at build
      - /app/venv
    depends_on:
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info
    env_file:
      - ./backend/.env
    volumes:
      # Celery has no autoreload: after changing task code run
      # `docker compose restart celery` — still far quicker than a rebuild.
      - ./backend:/app
      - /app/venv
    depends_on:
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      - redis


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"