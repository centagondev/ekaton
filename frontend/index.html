<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: without it env(safe-area-inset-*) resolves to 0 on
      notched iPhones, so the composer sits under the home indicator.
      interactive-widget=resizes-content: makes Android Chrome shrink the
      layout viewport for the keyboard instead of overlaying it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbf9f5" />
    <!--
      Theme, resolved before the first paint.

      Read from localStorage ALONE — `prefers-color-scheme` is never consulted,
      so a device in dark mode does not drag the app with it; light is what a
      first-time visitor gets on every platform. Inline and blocking on
      purpose: doing this in React would paint one frame of the wrong palette
      for anyone who chose dark. Kept in sync with lib/theme.ts.
    -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("ekaton:theme") === "dark") theme = "dark";
        } catch (e) {
          /* blocked storage — light */
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        // Opts out of the platform auto-darkening form controls, scrollbars
        // and — on Android Chrome — the page itself, before the stylesheet
        // that declares the same thing has loaded. `only` is required: a bare
        // `light` still lets Auto Dark Theme repaint everything.
        root.style.colorScheme = theme === "dark" ? "only dark" : "only light";
        if (theme === "dark") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#12120f");
        }
      })();
    </script>
    <meta
      name="description"
      content="Ekaton — anonymous conversations, live events and a complaint box for your campus."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' fill='%23FFD600' stroke='%230A0A0A' stroke-width='2'/%3E%3Cg fill='%230A0A0A'%3E%3Crect x='9' y='8' width='3.5' height='16'/%3E%3Crect x='9' y='8' width='14' height='3.5'/%3E%3Crect x='9' y='14.25' width='9' height='3.5'/%3E%3Crect x='9' y='20.5' width='14' height='3.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Ekaton</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
